name: NSE Daily Agent
on:
  schedule:
    - cron: '30 4 * * *'  # 9:30 AM IST
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt
    - run: |
        echo "GROK_API_KEY=${{ secrets.GROK_API_KEY }}" >> $GITHUB_ENV
        echo "GMAIL_USER=${{ secrets.GMAIL_USER }}" >> $GITHUB_ENV  
        echo "GMAIL_PASS=${{ secrets.GMAIL_PASS }}" >> $GITHUB_ENV
    - run: python nse_agent.py
